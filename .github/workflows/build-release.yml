name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release source and version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must be run from main.'
          }
          [xml]$project = Get-Content src/CodexTray/CodexTray.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must use major.minor.patch.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.304
      - name: Build, test, and package
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodexTray
          path: |
            dist/CodexTray.exe
            dist/LICENSE.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CodexTray
          path: dist
      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # A failed lookup must not be treated as an unused version.
          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$tags"; then
            echo "Tag $tag already exists. Bump the project version before publishing."
            exit 1
          fi
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if grep -Fxq "$tag" <<< "$releases"; then
            echo "Release $tag already exists. Review it instead of overwriting it."
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          Download **CodexTray.exe** and run it. No installer or API key is needed.

          Requires Windows 10 1903+ or Windows 11 with .NET Framework 4.8, and Codex installed and signed in with a ChatGPT account.

          To update, quit the tray app, replace the EXE, and run it again. Preferences and recorded history are preserved.

          The executable is unsigned. SHA256SUMS.txt contains its SHA-256 checksum. Source and license are available in this repository.
          NOTES
          gh release create "$tag" dist/CodexTray.exe dist/LICENSE.txt dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Codex Tray $tag" --notes-file release-notes.md --generate-notes --draft
          gh release edit "$tag" --draft=false --latest
